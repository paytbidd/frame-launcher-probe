<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Frame Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>html, body { margin: 0; background: #0D1A21; }</style>
</head>
<body>
<script>
/* Loader. This file should rarely change: jsDelivr caches branch files (like @main) for hours,
   so it looks up the newest commit on GitHub and loads everything else pinned to that commit.
   Commit-pinned files never change, so old and new versions can't mix. */
(function () {
  // ---- Version badge (bottom right). Drawn by the loader so it shows even if app.js fails.
  // The chip color is derived from the commit, so each version gets its own color.
  var badge = document.createElement('div');
  badge.style.cssText = 'position:fixed;right:40px;bottom:36px;z-index:99;display:flex;align-items:center;' +
    'font:500 20px Figtree,SamsungOne,Arial,sans-serif;color:#9BB0BA;letter-spacing:0.5px;';
  badge.innerHTML = '<span id="fl-chip" style="width:16px;height:16px;border-radius:5px;margin-right:10px;background:#2B414C"></span>' +
    '<span id="fl-ver">loading…</span><span id="fl-key" style="margin-left:14px;opacity:.6"></span>';
  document.documentElement.appendChild(badge);
  function showVersion(label, sha) {
    document.getElementById('fl-ver').textContent = label;
    if (sha) document.getElementById('fl-chip').style.background = 'hsl(' + (parseInt(sha.slice(0, 6), 16) % 360) + ',70%,58%)';
  }
  function showError(msg) {
    var v = document.getElementById('fl-ver');
    v.textContent = 'error: ' + msg;
    v.style.color = '#F08A66';
    document.getElementById('fl-chip').style.background = '#F08A66';
  }
  window.addEventListener('error', function (e) {
    showError((e.message || 'script error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
  });
  var keyTimer;
  document.addEventListener('keydown', function (e) {
    var k = document.getElementById('fl-key');
    k.textContent = 'key ' + e.keyCode;
    clearTimeout(keyTimer);
    keyTimer = setTimeout(function () { k.textContent = ''; }, 1500);
  }, true);

  var REPO = 'paytbidd/frame-launcher-probe';
  var SHA_KEY = 'frameLauncher.sha';
  var here = location.href.split('?')[0].replace(/[^\/]*$/, '');   // folder this page was served from
  var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && location.port !== '8081' && !/remote=1/.test(location.search);

  function start(base, fallback) {
    var b = document.createElement('base');
    b.href = base;
    document.head.appendChild(b);
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = base + 'style.css';
    document.head.appendChild(css);
    fetch(base + 'shell.html').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (html) {
      document.body.innerHTML = html;
      var js = document.createElement('script');
      js.src = base + 'app.js';
      js.onerror = function () { showError('app.js failed to load'); };
      document.body.appendChild(js);
    }).catch(function (e) {
      showError('shell.html: ' + (e && e.message));
      if (fallback && fallback !== base) { b.parentNode.removeChild(b); css.parentNode.removeChild(css); start(fallback); }
    });
  }

  if (local) { showVersion('dev'); start(here); return; }   // developing on the Mac: use the files next to this page

  var done = false;
  function go(sha) {
    if (done) return;
    done = true;
    showVersion(sha ? sha.slice(0, 7) : 'branch copy', sha);
    start(sha ? 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/' : here, here);
  }
  var cached = null;
  try { cached = localStorage.getItem(SHA_KEY); } catch (e) {}
  setTimeout(function () { go(cached); }, 4000);   // GitHub slow or down: use the last known version

  fetch('https://api.github.com/repos/' + REPO + '/commits/main', { headers: { Accept: 'application/vnd.github.sha' } })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (sha) {
      sha = sha.trim();
      if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('bad sha');
      try { localStorage.setItem(SHA_KEY, sha); } catch (e) {}
      go(sha);
    })
    .catch(function () { go(cached); });
})();
</script>
</body>
</html>
