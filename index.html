<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Frame Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>html, body { margin: 0; background: #0D1A21; }</style>
</head>
<body>
<script>
/* Loader. This file should rarely change: jsDelivr caches branch files (like @main) for hours,
   so it looks up the newest commit on GitHub and loads everything else pinned to that commit.
   Commit-pinned files never change, so old and new versions can't mix. */
(function () {
  var REPO = 'paytbidd/frame-launcher-probe';
  var SHA_KEY = 'frameLauncher.sha';
  var here = location.href.split('?')[0].replace(/[^\/]*$/, '');   // folder this page was served from
  var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && location.port !== '8081' && !/remote=1/.test(location.search);

  function start(base, fallback) {
    var b = document.createElement('base');
    b.href = base;
    document.head.appendChild(b);
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = base + 'style.css';
    document.head.appendChild(css);
    fetch(base + 'shell.html').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (html) {
      document.body.innerHTML = html;
      var js = document.createElement('script');
      js.src = base + 'app.js';
      document.body.appendChild(js);
    }).catch(function () {
      if (fallback && fallback !== base) { b.parentNode.removeChild(b); css.parentNode.removeChild(css); start(fallback); }
    });
  }

  if (local) { start(here); return; }   // developing on the Mac: use the files next to this page

  var done = false;
  function go(sha) {
    if (done) return;
    done = true;
    start(sha ? 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/' : here, here);
  }
  var cached = null;
  try { cached = localStorage.getItem(SHA_KEY); } catch (e) {}
  setTimeout(function () { go(cached); }, 4000);   // GitHub slow or down: use the last known version

  fetch('https://api.github.com/repos/' + REPO + '/commits/main', { headers: { Accept: 'application/vnd.github.sha' } })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (sha) {
      sha = sha.trim();
      if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('bad sha');
      try { localStorage.setItem(SHA_KEY, sha); } catch (e) {}
      go(sha);
    })
    .catch(function () { go(cached); });
})();
</script>
</body>
</html>
